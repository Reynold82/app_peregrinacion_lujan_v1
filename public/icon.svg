<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Subtle halo ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.4" />

  <!-- Church / Basilica Silhouette -->
  <path d="M256 90 L276 130 L236 130 Z" fill="url(#goldGrad)" />
  <rect x="251" y="60" width="10" height="35" fill="url(#goldGrad)" />
  <rect x="240" y="70" width="32" height="8" fill="url(#goldGrad)" />

  <!-- Central Basilica Tower -->
  <path d="M210 180 L256 130 L302 180 L302 360 L210 360 Z" fill="#ffffff" opacity="0.95" />
  
  <!-- Side Towers -->
  <path d="M140 220 L175 180 L210 220 L210 360 L140 360 Z" fill="#cbd5e1" />
  <path d="M302 220 L337 180 L372 220 L372 360 L302 360 Z" fill="#cbd5e1" />

  <!-- Rose Window -->
  <circle cx="256" cy="220" r="26" fill="url(#cyanGrad)" />
  <circle cx="256" cy="220" r="18" fill="url(#bgGrad)" />
  <circle cx="256" cy="220" r="6" fill="url(#goldGrad)" />

  <!-- Central Arched Portal -->
  <path d="M236 360 L236 290 A20 20 0 0 1 276 290 L276 360 Z" fill="url(#bgGrad)" />

  <!-- Road / Pathway to Basilica -->
  <polygon points="120,430 392,430 320,360 192,360" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Year 2026 Badge -->
  <rect x="186" y="440" width="140" height="34" rx="17" fill="url(#cyanGrad)" />
  <text x="256" y="463" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">LUJÁN 2026</text>
</svg>
